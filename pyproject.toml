[project]
name = "support-agent"
version = "1.0.0"
description = "AI agent that drafts replies to customer emails, approved by a person"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Miquel Moreno", email = "miquel.moreno.martinez@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.30",
    "faker>=40",
    "langgraph>=0.6",
    "langchain-openai>=0.3",
    "langgraph-checkpoint-postgres>=3",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "mypy>=1.13",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts, and obviously fake secrets used as fixtures.
"tests/**" = ["S101", "S105", "S106"]
# Dev scripts: asserts for invariants; randomness is for fake data, not security.
"scripts/**" = ["S101", "S311"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["src/support_agent"]
branch = true
# SQLAlchemy async runs code inside greenlets; without this, lines after an await are missed.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_empty = true
